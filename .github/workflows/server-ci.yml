name: Mite CI/CD

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Apply migrations and deploy the API and family PWA after CI succeeds
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  client-format:
    name: Client formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Formatting does not need Electron downloads or native install scripts.
      - run: npm ci --ignore-scripts
      - run: npm run format:check

  client:
    name: Client lint, tests and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      # The client workspace installs @mite/api-client from its built local package.
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm run typecheck
        working-directory: client
      - run: npm run test
        working-directory: client
      - name: Build clients with the production family PWA paths
        working-directory: client
        env:
          VITE_API_BASE_URL: https://priv.chi-llenge.com/mite
          VITE_DEMO_FAMILY_TOKEN: ""
          VITE_PWA_BASE_PATH: /mite/pwa/
        run: npm run build

  generated-api:
    name: Generated code and shared API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: go tool sqlc generate
        working-directory: server
      - name: Check generated files
        run: |
          git diff --exit-code -- server/internal/generated server/db/generated packages/api-client/src/generated
          untracked="$(git ls-files --others --exclude-standard -- server/internal/generated server/db/generated packages/api-client/src/generated)"
          if [[ -n "$untracked" ]]; then
            printf 'Generated files are not tracked:\n%s\n' "$untracked"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  server:
    name: Go tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - run: go test -race ./... -count=1 -timeout=5m
      - run: go vet ./...
      - run: go build ./...
      - name: Test VPS deployment and rollback
        run: bash deploy/test-mite-deploy.sh
      - name: Test Supabase and VPS deployment sequence
        run: bash deploy/test-deploy-from-ci.sh
      - name: Test family PWA deployment and rollback
        run: bash deploy/test-mite-pwa-deploy.sh
      - name: Test family PWA deployment sequence
        run: bash deploy/test-deploy-pwa-from-ci.sh

  integration:
    name: Supabase integration and HTTP WebSocket E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Start an ephemeral Supabase with migrations
        timeout-minutes: 15
        run: |
          # The startup summary contains local API keys; keep it out of the log.
          if ! npx --no-install supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            docker ps -a --format 'table {{.Names}}\t{{.Status}}'
            printf '::error::Supabase startup failed. Reproduce with npm ci and npx --no-install supabase start.\n'
            exit 1
          fi
      - name: Run database, Storage and runtime integration tests
        run: |
          eval "$(npx --no-install supabase status -o env 2>/dev/null)"
          : "${DB_URL:?Local database URL is missing}"
          : "${API_URL:?Local Supabase URL is missing}"
          : "${SECRET_KEY:?Local Supabase secret key is missing}"
          printf '::add-mask::%s\n' "$DB_URL" "$SECRET_KEY"
          export MITE_TEST_DATABASE_URL="$DB_URL"
          export MITE_TEST_SUPABASE_URL="$API_URL"
          export MITE_TEST_SUPABASE_SECRET_KEY="$SECRET_KEY"
          export MITE_E2E_DATABASE_URL="$DB_URL"
          export MITE_E2E_SUPABASE_URL="$API_URL"
          export MITE_E2E_SUPABASE_SECRET_KEY="$SECRET_KEY"
          cd server
          # Run packages serially so runtime workers do not consume other tests' jobs.
          go test -race -p 1 ./... -run 'Postgres|Integration|^TestServerRuntimeE2E$' -count=1 -timeout=5m -v
      - name: Stop ephemeral Supabase
        if: always()
        run: npx --no-install supabase stop --no-backup

  deploy:
    name: Migrate Supabase and deploy to VPS
    needs: [client-format, client, generated-api, server, integration]
    if: >-
      vars.VPS_DEPLOY_BRANCH != '' &&
      github.ref == format('refs/heads/{0}', vars.VPS_DEPLOY_BRANCH) &&
      ((github.event_name == 'push' && vars.VPS_AUTO_DEPLOY == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: vps-mirai-server
    concurrency:
      group: mite-vps-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build Linux amd64 binary
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -o "$RUNNER_TEMP/mite-api" ./cmd/api
      - name: Apply migrations and restart the existing service
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: bash server/deploy/deploy-from-ci.sh "$RUNNER_TEMP/mite-api"

  deploy-pwa:
    name: Deploy family PWA to VPS
    needs: [deploy]
    if: >-
      needs.deploy.result == 'success' &&
      vars.VPS_DEPLOY_BRANCH != '' &&
      github.ref == format('refs/heads/{0}', vars.VPS_DEPLOY_BRANCH) &&
      ((github.event_name == 'push' && vars.VPS_AUTO_DEPLOY == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: vps-mirai-server
    concurrency:
      group: mite-vps-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: client
      - name: Build family PWA for HTTPS subpath deployment
        working-directory: client
        env:
          VITE_API_BASE_URL: https://priv.chi-llenge.com/mite
          VITE_DEMO_FAMILY_TOKEN: ""
          VITE_PWA_BASE_PATH: /mite/pwa/
        run: npm run build -w @mite/family-pwa
      - name: Package family PWA
        run: tar -czf "$RUNNER_TEMP/mite-family-pwa.tar.gz" -C client/apps/family-pwa/dist .
      - name: Deploy and verify family PWA
        env:
          GH_TOKEN: ${{ github.token }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: bash server/deploy/deploy-pwa-from-ci.sh "$RUNNER_TEMP/mite-family-pwa.tar.gz"
