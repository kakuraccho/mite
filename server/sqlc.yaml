version: "2"
sql:
  - engine: postgresql
    schema: ../supabase/migrations
    queries: db/queries
    gen:
      go:
        package: dbgen
        out: db/generated
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_result_struct_pointers: true
        overrides:
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
